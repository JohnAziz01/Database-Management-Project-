[pytest]
testpaths = unit api e2e
markers =
    unit: fast tests of pure Python logic, no database or server
    api: tests that call the FastAPI backend against the test database
    e2e: browser tests that drive the real React UI with Playwright
    security: tests that check authentication, authorization, or injection
    known_bug: test documents an open bug from docs/BUG_REPORTS.md (expected to fail)
# -r: print a summary line for xfail (known bug), xpass, skip, and fail
addopts = -ra --strict-markers
# A known-bug test that unexpectedly PASSES fails the run, so you notice the
# bug was fixed and can close it in BUG_REPORTS.md.
xfail_strict = true
